<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="womanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="womanGlow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Halo Ring Gradient -->
    <linearGradient id="womanHalo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f3e8ff" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Woman Silhouette Gradient -->
    <linearGradient id="womanSilhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="womanDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="500" fill="url(#womanBg)"/>

  <!-- Ambient Purple/Indigo Lighting -->
  <circle cx="200" cy="220" r="180" fill="url(#womanGlow)"/>

  <!-- Subtle Minimal Halo Circle behind head -->
  <circle cx="200" cy="195" r="95" fill="none" stroke="url(#womanHalo)" stroke-width="2.5" opacity="0.8"/>
  <circle cx="200" cy="195" r="115" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 6" opacity="0.25"/>

  <!-- Minimalist Silhouette (No cartoon facial clutter) -->
  <g filter="url(#womanDropShadow)">
    <!-- Flowing Hair Silhouette in Back -->
    <path d="M 140 185 C 122 235 125 320 152 355 C 160 340 160 310 156 270 Z" fill="#334155" opacity="0.35"/>
    <path d="M 260 185 C 278 235 275 320 248 355 C 240 340 240 310 244 270 Z" fill="#334155" opacity="0.35"/>

    <!-- Shoulders & Torso -->
    <path d="M 90 500 C 90 415 120 370 158 352 C 170 346 184 344 200 344 C 216 344 230 346 242 352 C 280 370 310 415 310 500 Z" fill="url(#womanSilhouette)"/>

    <!-- V-Neck / Top contour detail -->
    <path d="M 182 344 Q 200 375 218 344 Z" fill="#334155" opacity="0.25"/>

    <!-- Graceful Slender Neck -->
    <path d="M 185 285 L 185 344 C 190 346 195 347 200 347 C 205 347 210 346 215 344 L 215 285 Z" fill="url(#womanSilhouette)"/>

    <!-- Head & Flowing Hair Silhouette -->
    <!-- Base Head Circle -->
    <ellipse cx="200" cy="208" rx="50" ry="56" fill="url(#womanSilhouette)"/>

    <!-- Women's Elegant Hairline & Flowing Front Layers -->
    <path d="M 142 195 C 138 145 162 130 200 130 C 238 130 262 145 258 195 C 255 165 238 140 200 140 C 162 140 145 165 142 195 Z" fill="#334155" opacity="0.4"/>
    <path d="M 145 185 C 145 150 168 132 200 132 C 215 132 238 138 255 158 C 235 145 208 142 180 155 C 160 165 150 180 145 200 Z" fill="#1e293b" opacity="0.3"/>
    <path d="M 255 185 C 255 155 235 135 205 132 C 225 138 245 150 252 175 Z" fill="#1e293b" opacity="0.25"/>
  </g>

  <!-- Clean Bottom Fade for seamless integration -->
  <rect y="488" width="400" height="12" fill="url(#womanBg)" opacity="0.8"/>
</svg>
