<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="manBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="manGlow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#60a5fa" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Halo Ring Gradient -->
    <linearGradient id="manHalo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Man Silhouette Gradient -->
    <linearGradient id="manSilhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="manDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="500" fill="url(#manBg)"/>

  <!-- Ambient Blue Lighting -->
  <circle cx="200" cy="220" r="180" fill="url(#manGlow)"/>

  <!-- Subtle Minimal Halo Circle behind head -->
  <circle cx="200" cy="195" r="95" fill="none" stroke="url(#manHalo)" stroke-width="2.5" opacity="0.8"/>
  <circle cx="200" cy="195" r="115" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 6" opacity="0.25"/>

  <!-- Minimalist Silhouette (No cartoon facial clutter) -->
  <g filter="url(#manDropShadow)">
    <!-- Shoulders & Torso -->
    <path d="M 85 500 C 85 410 115 365 155 348 C 168 342 182 340 200 340 C 218 340 232 342 245 348 C 285 365 315 410 315 500 Z" fill="url(#manSilhouette)"/>

    <!-- Collar / Inner shadow detail (clean modern notch) -->
    <path d="M 180 340 L 200 375 L 220 340 Z" fill="#334155" opacity="0.25"/>

    <!-- Neck -->
    <path d="M 182 285 L 182 342 C 188 344 194 345 200 345 C 206 345 212 344 218 342 L 218 285 Z" fill="url(#manSilhouette)"/>

    <!-- Head with modern masculine hair silhouette -->
    <!-- Base Head Circle -->
    <ellipse cx="200" cy="210" rx="52" ry="58" fill="url(#manSilhouette)"/>

    <!-- Hair Silhouette (Subtle top volume & clean side tapers) -->
    <path d="M 148 205 C 145 160 162 135 200 135 C 238 135 255 160 252 205 C 250 175 238 145 200 145 C 162 145 150 175 148 205 Z" fill="#334155" opacity="0.35"/>
    <path d="M 152 185 C 150 148 168 130 202 128 C 236 126 252 144 250 185 C 246 155 232 138 200 138 C 168 138 154 155 152 185 Z" fill="#1e293b" opacity="0.3"/>
  </g>

  <!-- Clean Bottom Fade for seamless integration -->
  <rect y="488" width="400" height="12" fill="url(#manBg)" opacity="0.8"/>
</svg>
